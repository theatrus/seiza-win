name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build and sign the Windows installer
    if: github.repository == 'theatrus/seiza-win' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The Entra federated credential is bound to the subject
    # `repo:theatrus/seiza-win:environment:release`, so this job must run in the
    # `release` environment or the OIDC token will not match and azure/login
    # fails. A job belongs to exactly one environment, and SPARKLE_ED_PRIVATE_KEY
    # lives in `signing`, which is why the appcast and the release upload now sit
    # in a second job below.
    environment: release
    permissions:
      contents: read
      # Required for the OIDC exchange with Entra that authenticates
      # Authenticode signing. No Azure signing secret is stored in this repo.
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      notes: ${{ steps.release-metadata.outputs.notes }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      SPARKLE_PUBLIC_KEY: Jk4K7QO9ohQbi455S888/lnSiqXB6a5sB4wEuEZjaQ0=
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate release tag and notes
        id: release-metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must have the form vMAJOR.MINOR.PATCH"
          }
          $version = $Matches[1]
          [xml] $project = Get-Content src\Seiza.App\Seiza.App.csproj
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -ne $projectVersion) {
            throw "Tag version $version does not match app version $projectVersion"
          }
          $notes = "docs\releases\$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are required at $notes"
          }
          if (-not (Select-String -Quiet -LiteralPath src\Seiza.App\Services\UpdateController.cs -SimpleMatch $env:SPARKLE_PUBLIC_KEY)) {
            throw "The release key does not match the public key compiled into the app"
          }
          "SEIZA_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
          # The publishing job runs in a different environment and so cannot read
          # this job's GITHUB_ENV.
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust core
        run: .\scripts\build-rust.ps1 -Test

      - name: Restore application
        run: dotnet restore Seiza.slnx -r win-x64 -p:Configuration=Release

      # Authenticode signing runs through Azure Artifact Signing, formerly
      # Trusted Signing. The key stays in Microsoft's HSM and we only ever hold a
      # short-lived OIDC-exchanged token.
      #
      # Every signing step is gated on the variable being present so a fork,
      # which has neither the variables nor access to the federated credential,
      # still produces an installer rather than failing outright.
      - name: Authenticate to Azure for code signing
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Phase one of a two-phase build. The wixproj publishes the app itself when
      # it builds the MSI, which leaves no moment at which the application files
      # exist but are not yet packaged. Running the publish on its own opens that
      # moment, so the binaries can be signed before the installer seals them in.
      - name: Publish the application
        run: dotnet build packaging\windows\Seiza.App.wixproj -c Release -p:SeizaVersion=${{ env.SEIZA_VERSION }} -t:PublishSeizaApp

      - name: Resolve the application binaries to sign
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          # Named one by one, never a folder-and-recurse sweep. This is a
          # self-contained publish: some two hundred files, nearly all of them
          # Microsoft's .NET runtime and Windows App SDK, which Microsoft has
          # already signed. Signing those would replace their publisher identity
          # with ours and would spend the Basic tier's 5,000 signatures a month
          # on files nobody asked us to vouch for. Only first-party code is
          # listed, and each name is checked so a rename cannot quietly shrink
          # the set.
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\win-x64"
          $names = @(
            "Seiza.App.exe",              # the native host Windows actually launches
            "Seiza.App.dll",              # the managed application itself
            "seiza_cabi.dll",             # first-party Rust core
            "SeizaThumbnailProvider.dll"  # first-party Rust shell extension
          )
          $paths = foreach ($name in $names) {
            $path = Join-Path $publish $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected to sign $path but the publish did not produce it"
            }
            (Resolve-Path -LiteralPath $path).Path
          }
          $paths | ForEach-Object { Write-Output "will sign: $_" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8NoBOM -Value (
            @("SIGN_FILES<<SIGN_FILES_EOF") + $paths + @("SIGN_FILES_EOF"))

      # Microsoft's own action, not the community trusted-signing-cli. That tool
      # hard-requires --azure-client-secret and has no OIDC path at all, so using
      # it would mean keeping a signing secret in this repository. This action
      # authenticates through DefaultAzureCredential and rides the azure/login
      # session above.
      - name: Sign the application binaries
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ env.SIGN_FILES }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Phase two. WiX harvests the published directory as it stands, so the
      # signatures applied above travel into the installer untouched.
      - name: Build all-users MSI
        run: dotnet build packaging\windows\Seiza.App.wixproj -c Release -p:SeizaVersion=${{ env.SEIZA_VERSION }} -p:SeizaSkipPublish=true

      # Only the installer here. The four binaries were signed before packaging;
      # signing them again would spend quota twice and append a second signature
      # to a file that already carries a good one.
      - name: Sign the MSI
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\seiza-${{ env.SEIZA_VERSION }}-windows-x86_64.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Five artifacts must verify, not one. The MSI is what a user downloads;
      # the four binaries are what gets installed and run afterwards. Checking
      # the MSI alone would pass happily while shipping unsigned executables
      # inside a signed wrapper.
      - name: Verify Windows signatures
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -LiteralPath "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object -Property FullName |
            Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner" }
          Write-Output "using: $($signtool.FullName)"

          $binaries = $env:SIGN_FILES -split '\r?\n' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
          $msi = (Resolve-Path -LiteralPath ".\dist\seiza-$($env:SEIZA_VERSION)-windows-x86_64.msi").Path

          foreach ($artifact in @($binaries) + @($msi)) {
            Write-Output "--- $artifact"
            $report = & $signtool.FullName verify /pa /v $artifact
            $report | Write-Output
            if ($LASTEXITCODE -ne 0) {
              throw "$artifact does not carry a signature that chains to a trusted root"
            }
            if (-not ($report | Select-String -SimpleMatch "StackFoundry LLC" -Quiet)) {
              throw "$artifact is signed by someone other than StackFoundry LLC"
            }
          }
          Write-Output "OK: the installer and all four first-party binaries are signed as StackFoundry LLC"

      # Both tests run against the signed MSI rather than an earlier copy, so
      # what CI exercises is byte for byte what ships.
      - name: Verify installer Finish launch action
        run: .\.github\scripts\test-windows-installer-launch.ps1 -Msi ".\dist\seiza-${{ env.SEIZA_VERSION }}-windows-x86_64.msi"

      - name: Smoke-test Windows installer
        run: .\.github\scripts\test-windows-installer.ps1 -Msi ".\dist\seiza-${{ env.SEIZA_VERSION }}-windows-x86_64.msi"

      - name: Hand the signed installer to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: seiza-${{ env.SEIZA_VERSION }}-windows-msi
          path: dist/seiza-${{ env.SEIZA_VERSION }}-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Sign the appcast and publish the release
    needs: build
    # SPARKLE_ED_PRIVATE_KEY lives in the `signing` environment, and Authenticode
    # needs `release`. One job cannot have both, so the release is split here.
    # The order this imposes is the right one anyway: the Sparkle signature has
    # to cover the Authenticode-signed installer, because that is the file
    # clients download. Signing the MSI after the appcast was generated would
    # leave every existing install refusing the update.
    environment: signing
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      SEIZA_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_NOTES: ${{ needs.build.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download the signed installer
        uses: actions/download-artifact@v7
        with:
          name: seiza-${{ needs.build.outputs.version }}-windows-msi
          path: dist

      # Cheap insurance against the failure that would otherwise be silent: an
      # appcast whose signature covers pre-Authenticode bytes looks perfectly
      # healthy in CI and breaks every installed client.
      - name: Confirm the installer is signed before signing the appcast
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -LiteralPath "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object -Property FullName |
            Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner" }
          $msi = (Resolve-Path -LiteralPath ".\dist\seiza-$($env:SEIZA_VERSION)-windows-x86_64.msi").Path
          $report = & $signtool.FullName verify /pa /v $msi
          $report | Write-Output
          if ($LASTEXITCODE -ne 0) {
            throw "The downloaded installer is not Authenticode signed"
          }
          if (-not ($report | Select-String -SimpleMatch "StackFoundry LLC" -Quiet)) {
            throw "The downloaded installer is signed by someone other than StackFoundry LLC"
          }

      - name: Restore release tools
        run: dotnet tool restore

      - name: Generate signed Sparkle appcast
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
            throw "SPARKLE_ED_PRIVATE_KEY is not configured in the signing environment"
          }
          $msi = Resolve-Path ".\dist\seiza-$($env:SEIZA_VERSION)-windows-x86_64.msi"
          $releaseBase = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:GITHUB_REF_NAME)"
          $appcastNotes = Join-Path $env:RUNNER_TEMP "seiza-appcast-notes"
          New-Item -ItemType Directory -Force -Path $appcastNotes | Out-Null
          Copy-Item -LiteralPath $env:RELEASE_NOTES -Destination (Join-Path $appcastNotes "$($env:SEIZA_VERSION).md")
          dotnet tool run netsparkle-generate-appcast -- `
            --single-file $msi `
            --file-version $env:SEIZA_VERSION `
            --appcast-output-directory .\dist `
            --base-url $releaseBase `
            --change-log-path $appcastNotes `
            --product-name "Seiza for Windows" `
            --os windows-x64 `
            --description-tag "Seiza for Windows updates" `
            --link-tag "https://github.com/$($env:GITHUB_REPOSITORY)/releases/latest/download/appcast.xml" `
            --use-ed25519-signature-attribute `
            --human-readable true

          $appcast = ".\dist\appcast.xml"
          $appcastSignature = "$appcast.signature"
          if (-not (Test-Path -LiteralPath $appcast -PathType Leaf) -or
              -not (Test-Path -LiteralPath $appcastSignature -PathType Leaf)) {
            throw "NetSparkle did not produce the signed appcast and detached signature"
          }
          [xml] $feed = Get-Content -LiteralPath $appcast -Raw
          $expectedUrl = "$releaseBase/$([System.IO.Path]::GetFileName($msi))"
          if ([string] $feed.rss.channel.item.enclosure.url -ne $expectedUrl) {
            throw "Appcast download URL does not match the release asset"
          }

      - name: Produce checksums
        shell: pwsh
        run: |
          $files = @(
            ".\dist\seiza-$($env:SEIZA_VERSION)-windows-x86_64.msi",
            ".\dist\appcast.xml",
            ".\dist\appcast.xml.signature"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file
            "$($hash.Hash.ToLowerInvariant()) *$([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seiza-${{ env.SEIZA_VERSION }}-windows-release
          path: |
            dist/seiza-${{ env.SEIZA_VERSION }}-windows-x86_64.msi
            dist/appcast.xml
            dist/appcast.xml.signature
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --verify-tag `
            --title "Seiza for Windows $($env:GITHUB_REF_NAME)" `
            --notes-file $env:RELEASE_NOTES `
            ".\dist\seiza-$($env:SEIZA_VERSION)-windows-x86_64.msi" `
            .\dist\appcast.xml `
            .\dist\appcast.xml.signature `
            .\dist\SHA256SUMS.txt
