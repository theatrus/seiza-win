[package]
name = "seiza-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seiza-analysis = { path = "../seiza-analysis" }
seiza = "=0.45.0"
seiza-stacking = "=0.52.0"
seiza-stretch = "=0.3.2"
sha2 = "0.11"
seiza-fits = "=0.6.0"
seiza-image-io = "=0.11.0"
seiza-xisf = "=0.7.0"
serde = { version = "1", features = ["derive"] }
seiza-download = "=0.9.0"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
