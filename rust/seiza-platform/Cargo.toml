[package]
name = "seiza-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seiza.workspace = true
seiza-stacking.workspace = true
seiza-stretch.workspace = true
sha2 = "0.11"
seiza-fits.workspace = true
seiza-image-io.workspace = true
serde = { version = "1", features = ["derive"] }
seiza-download.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
