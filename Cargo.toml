[workspace]
resolver = "3"
members = [
    "rust/seiza-cabi-pin",
    "rust/seiza-thumbnail-provider",
    "rust/seiza-platform",
]

# Published Seiza dependencies are pinned together for the Windows app.
[workspace.dependencies]
seiza = "=0.49.0"
seiza-cabi = "=0.49.0"
seiza-stacking = "=0.57.0"
seiza-fits = "=0.8.0"
seiza-xisf = "=0.9.0"
seiza-image-io = "=0.13.0"
seiza-stretch = "=0.3.2"
seiza-download = "=0.9.0"
