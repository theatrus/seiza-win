[workspace]
resolver = "3"
members = [
    "rust/seiza-cabi-pin",
    "rust/seiza-thumbnail-provider",
    "rust/seiza-platform",
]

# Published Seiza dependencies are pinned together for the Windows app.
[workspace.dependencies]
seiza = "=0.50.0"
seiza-cabi = "=0.50.0"
seiza-stacking = "=0.58.0"
seiza-fits = "=0.8.1"
seiza-xisf = "=0.9.1"
seiza-image-io = "=0.13.1"
seiza-stretch = "=0.3.3"
seiza-download = "=0.9.1"
